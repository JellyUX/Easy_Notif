<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background-color:#f3f4f6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:8px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a;">
        <tr>
          <td style="background-color:#2b2f36;border-radius:8px 8px 0 0;padding:20px 28px;">
            <div style="font-size:20px;font-weight:700;color:#ffffff;">{{heading}}</div>
          </td>
        </tr>

        <tr>
          <td style="padding:20px 28px;font-size:15px;line-height:1.6;color:#1a1a1a;border-bottom:1px solid #e5e7eb;">
            {{{body}}}
          </td>
        </tr>

        <tr>
          <td style="padding:20px 28px;font-size:12px;color:#6b7280;line-height:1.5;border-radius:0 0 8px 8px;">
            <p style="margin:0 0 6px;">Message sent by the administrator of your Jellyfin server.</p>
            {{#if unsubscribeUrl}}<p style="margin:0;"><a href="{{unsubscribeUrl}}" style="color:#6b7280;">Stop all emails from this server</a></p>{{/if}}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
