name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      # dotnet list exits 0 even when it finds vulnerable packages, so the JSON report is checked.
      - name: Audit NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive --format json > nuget-audit.json
          python3 - <<'EOF'
          import json, sys
          with open("nuget-audit.json", encoding="utf-8") as f:
              data = json.load(f)
          hits = [
              f"{p['path']}: {pkg['id']} {pkg.get('resolvedVersion', '')}"
              for p in data.get("projects", [])
              for fw in p.get("frameworks", [])
              for kind in ("topLevelPackages", "transitivePackages")
              for pkg in fw.get(kind, [])
              if pkg.get("vulnerabilities")
          ]
          print("\n".join(hits) or "OK - no vulnerable NuGet package")
          sys.exit(1 if hits else 0)
          EOF

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --configuration Release --collect "XPlat Code Coverage" --results-directory ./coverage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: error

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Node dependencies
        run: npm ci

      - name: Audit npm production dependencies
        run: npm audit --omit=dev

      - name: Run Vitest
        run: npm test

  release:
    name: Release
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # semantic-release/git pushes the release commit + tag; /github creates the release
      issues: write          # semantic-release/github comments on released issues
      pull-requests: write   # ... and on released PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # jprm builds the published zip and the MD5 recorded in manifest.json, so its version is
      # pinned deliberately. Bump it in a dedicated ci: commit with a reason - same policy as the
      # semantic-release chain (see dependabot.yml).
      - name: Install JPRM
        run: pip install jprm==1.1.0

      - name: Install semantic-release dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npx semantic-release
