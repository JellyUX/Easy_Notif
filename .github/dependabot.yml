version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # The semantic-release chain is pinned to known-good versions (see TODO_V1.md).
    # A broken toolchain bump would only surface at release time, so upgrades are handled
    # deliberately, not by Dependabot.
    ignore:
      - dependency-name: "semantic-release"
      - dependency-name: "@semantic-release/*"
      - dependency-name: "conventional-changelog-conventionalcommits"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The Jellyfin.* packages are pinned to 12.0.0, the declared minimum ABI (build.yaml
      # targetAbi 12.0.0.0). Compiling against the lowest supported release is deliberate: an API
      # present in 12.0.0 is present in every later 12.x, not the reverse. Any pin change is a
      # manual chore:/fix: commit with a written reason, never a Dependabot bump.
      - dependency-name: "Jellyfin.Controller"
      - dependency-name: "Jellyfin.Model"
      - dependency-name: "Jellyfin.Extensions"
      # Microsoft.Extensions.* assemblies are supplied by the Jellyfin host at runtime
      # (ExcludeAssets="runtime"): 10.0.x on Jellyfin 12 (.NET 10). Compiling against an 11.x
      # assembly would request a version the host does not load, and the plugin would fail to
      # register. Major bumps wait for a Jellyfin line on .NET 11; minor and patch stay allowed.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
