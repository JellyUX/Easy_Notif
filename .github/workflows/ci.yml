name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # global.json selects the .NET 10 SDK, which still builds the net9.0 target. The 9.0 install
      # only provides the runtime the net9.0 test project runs on.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore --locked-mode

      # dotnet list exits 0 even when it finds vulnerable packages, so the JSON report is checked.
      - name: Audit NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive --format json > nuget-audit.json
          python3 - <<'EOF'
          import json, sys
          with open("nuget-audit.json", encoding="utf-8") as f:
              data = json.load(f)
          hits = [
              f"{p['path']}: {pkg['id']} {pkg.get('resolvedVersion', '')}"
              for p in data.get("projects", [])
              for fw in p.get("frameworks", [])
              for kind in ("topLevelPackages", "transitivePackages")
              for pkg in fw.get(kind, [])
              if pkg.get("vulnerabilities")
          ]
          print("\n".join(hits) or "OK - no vulnerable NuGet package")
          sys.exit(1 if hits else 0)
          EOF

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --no-build --configuration Release --collect "XPlat Code Coverage" --results-directory ./coverage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: error

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install Node dependencies
        run: npm ci

      - name: Audit npm production dependencies
        run: npm audit --omit=dev

      - name: Run Vitest
        run: npm test

  # Throwaway copy compiled against Jellyfin 12 (net10.0, derived from JellyfinVersion in
  # Directory.Build.props). It publishes nothing and the release job does not wait for it. The
  # committed lock files pin 10.11.10 / net9.0, so this job restores into a lock file under obj/.
  compat-12:
    name: Build & Test (Jellyfin 12)
    runs-on: ubuntu-latest
    env:
      JELLYFIN_PROPS: -p:JellyfinVersion=12.4.0 -p:NuGetLockFilePath=obj/packages.compat.lock.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore $JELLYFIN_PROPS

      - name: Build
        run: dotnet build --configuration Release --no-restore $JELLYFIN_PROPS

      - name: Test
        run: dotnet test --no-build --configuration Release $JELLYFIN_PROPS

  release:
    name: Release
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # semantic-release/git pushes the release commit + tag; /github creates the release
      issues: write          # semantic-release/github comments on released issues
      pull-requests: write   # ... and on released PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # jprm builds the published zip and the MD5 recorded in manifest.json, so it and its
      # dependencies are pinned by hash in requirements-jprm.txt. Bump them in a dedicated ci:
      # commit with a reason - same policy as the semantic-release chain (see dependabot.yml).
      - name: Install JPRM
        run: pip install --require-hashes -r .github/requirements-jprm.txt

      - name: Install semantic-release dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npx semantic-release
