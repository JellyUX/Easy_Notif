name: Jellyfin next

# Weekly check for the first Jellyfin 13 package on NuGet (release candidate or stable). While none
# exists the run succeeds with an explicit message. Once one exists, a throwaway copy of the plugin
# is built and tested against it, the same way as the compat-12 job in ci.yml. Never runs on push
# and publishes nothing.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jellyfin-13:
    name: Build & Test (Jellyfin 13)
    runs-on: ubuntu-latest
    steps:
      - name: Find the latest Jellyfin 13 package
        id: find
        run: |
          version=$(curl -fsSL https://api.nuget.org/v3-flatcontainer/jellyfin.controller/index.json \
            | jq -r '[.versions[] | select(startswith("13."))] | last // empty')
          if [ -z "$version" ]; then
            echo "No Jellyfin 13 package on NuGet yet (Jellyfin.Controller 13.*): nothing to test."
          else
            echo "Found Jellyfin.Controller $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.find.outputs.version != ''

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.find.outputs.version != ''
        with:
          global-json-file: global.json

      - name: Build and test
        if: steps.find.outputs.version != ''
        env:
          JELLYFIN_PROPS: -p:JellyfinVersion=${{ steps.find.outputs.version }} -p:NuGetLockFilePath=obj/packages.compat.lock.json
        run: |
          dotnet restore $JELLYFIN_PROPS
          dotnet build --configuration Release --no-restore $JELLYFIN_PROPS
          dotnet test --no-build --configuration Release $JELLYFIN_PROPS
